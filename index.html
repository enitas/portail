<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Épreuve des Archontes - La Plume Céleste</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(14, 16, 22, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(224, 231, 255, 0.3);
      border-radius: 14px;
      color: #e2e8f0;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #94a3b8;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
      border: none;
      border-radius: 30px;
      color: #0f172a;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(226, 232, 240, 0.25);
      z-index: 200;
      touch-action: manipulation;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }

    #error-console {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(180, 20, 20, 0.92);
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      border-radius: 8px;
      z-index: 300;
      word-break: break-all;
    }
  </style>

  <script>
    function displayGlobalError(msg) {
      var errBox = document.getElementById('error-console');
      var statusTitle = document.getElementById('status-title');
      var statusDesc = document.getElementById('status-desc');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = '❌ Erreur : ' + msg;
      }
      if (statusTitle) {
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
      }
      if (statusDesc) {
        statusDesc.textContent = "Consultez le message rouge ci-dessous.";
      }
    }

    window.onerror = function(message, source, lineno, colno, error) {
      displayGlobalError(message + ' (' + source + ':' + lineno + ')');
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      displayGlobalError(event.reason ? (event.reason.message || event.reason) : 'Erreur réseau/module');
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE DU SCEAU</div>
    <div id="status-desc">Appuyez sur le bouton pour démarrer.</div>
  </div>

  <button id="start-btn">INSPECTER LE MUR</button>
  <div id="error-console"></div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. AUDIO MINÉRAL & GONG CÉLESTE
    let audioCtx = null;
    let isAudioActive = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isAudioActive = true;
    }

    function playScratchSound() {
      if (!isAudioActive || !audioCtx) return;
      try {
        const duration = 0.04;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1);
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400 + Math.random() * 200;

        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.008, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + duration);
      } catch(e) {}
    }

    function playGongSound() {
      if (!isAudioActive || !audioCtx) return;
      try {
        const harmonics = [147.83, 293.66, 369.99, 587.33, 739.99];
        const now = audioCtx.currentTime;

        harmonics.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          const vol = 0.1 / (i + 1);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 4.0);
        });
      } catch(e) {}
    }

    // 2. TEXTE ET CANVA D'ÉCRITURE
    const TEXT_TO_WRITE = [
      "Nul ne franchira ces portes",
      "sans la lumiere de l'obsidienne.",
      "",
      "Regardez l'Orbe sous la lumiere noire :",
      "le passage s'ouvrira avec le code sacre."
    ];

    const PLANE_WIDTH = 1.2;
    const PLANE_HEIGHT = 0.6;

    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const textTexture = new THREE.CanvasTexture(canvas);
    
    const planeGeo = new THREE.PlaneGeometry(PLANE_WIDTH, PLANE_HEIGHT);
    const planeMat = new THREE.MeshBasicMaterial({ 
      map: textTexture, 
      transparent: true, 
      opacity: 0.98,
      side: THREE.DoubleSide
    });
    const textMesh = new THREE.Mesh(planeGeo, planeMat);
    textMesh.position.z = 0.02;

    // 3. MODELISATION 3D D'UNE PLUME EN NACRE ET ARGENT (DÉTAILLÉE)
    function create3DQuillModel() {
      const group = new THREE.Group();

      // Tige principale (Argent métallisé)
      const shaftGeo = new THREE.CylinderGeometry(0.0025, 0.0008, 0.26, 16);
      const shaftMat = new THREE.MeshStandardMaterial({ 
        color: 0xc0c7d0, 
        roughness: 0.2, 
        metalness: 0.8 
      });
      const shaft = new THREE.Mesh(shaftGeo, shaftMat);
      shaft.position.y = 0.13;
      group.add(shaft);

      // Plumage travaillé avec entailles naturelles
      const featherShape = new THREE.Shape();
      featherShape.moveTo(0, 0);
      featherShape.bezierCurveTo(0.018, 0.04, 0.038, 0.11, 0.028, 0.19);
      featherShape.lineTo(0.02, 0.185); // Entaille 1
      featherShape.bezierCurveTo(0.035, 0.23, 0.022, 0.28, 0, 0.31); // Pointe haute
      featherShape.bezierCurveTo(-0.022, 0.28, -0.035, 0.23, -0.02, 0.185);
      featherShape.lineTo(-0.028, 0.19); // Entaille 2
      featherShape.bezierCurveTo(-0.038, 0.11, -0.018, 0.04, 0, 0);

      const extrudeSettings = { 
        depth: 0.0015, 
        bevelEnabled: true, 
        bevelSegments: 3, 
        steps: 1, 
        bevelSize: 0.001, 
        bevelThickness: 0.001 
      };

      const featherGeo = new THREE.ExtrudeGeometry(featherShape, extrudeSettings);
      // Fini Blanc Nacre Céleste
      const featherMat = new THREE.MeshStandardMaterial({ 
        color: 0xf8fafc, 
        roughness: 0.3,
        metalness: 0.1,
        side: THREE.DoubleSide 
      });
      const feather = new THREE.Mesh(featherGeo, featherMat);
      feather.position.y = 0.04;
      group.add(feather);

      // Pointe Cristalline brillante
      const tipGeo = new THREE.SphereGeometry(0.005, 16, 16);
      const tipMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const tip = new THREE.Mesh(tipGeo, tipMat);
      tip.position.y = 0;
      group.add(tip);

      // Lumière ponctuelle au bout de la plume
      const light = new THREE.PointLight(0xe2e8f0, 1.5, 0.15);
      light.position.y = 0;
      group.add(light);

      // Inclinaison naturelle
      group.rotation.z = -Math.PI / 4.2;
      group.rotation.x = Math.PI / 7;

      return group;
    }

    const quill3D = create3DQuillModel();
    quill3D.visible = false;

    // Lumière ambiante pour les reflets de l'argent et de la nacre
    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(1, 2, 2);

    // 4. PARTICULES 3D (POUSSIÈRE D'ÉTOILE ARGEN TÉE)
    const MAX_SPARKS = 120;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(MAX_SPARKS * 3);
    const sparkData = [];

    for (let i = 0; i < MAX_SPARKS; i++) {
      sparkPositions[i * 3] = 0;
      sparkPositions[i * 3 + 1] = 0;
      sparkPositions[i * 3 + 2] = -999;
      sparkData.push({ vx: 0, vy: 0, vz: 0, life: 0, maxLife: 1 });
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));

    const sparkCanvas = document.createElement('canvas');
    sparkCanvas.width = 16; sparkCanvas.height = 16;
    const sCtx = sparkCanvas.getContext('2d');
    const grad = sCtx.createRadialGradient(8,8,0, 8,8,8);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#cbd5e1');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    sCtx.fillStyle = grad;
    sCtx.fillRect(0,0,16,16);
    const sparkTexture = new THREE.CanvasTexture(sparkCanvas);

    const sparkMat = new THREE.PointsMaterial({
      size: 0.02,
      map: sparkTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const sparkParticles = new THREE.Points(sparkGeo, sparkMat);

    function emitSpark(x, y, z) {
      for (let i = 0; i < MAX_SPARKS; i++) {
        if (sparkData[i].life <= 0) {
          sparkPositions[i * 3] = x;
          sparkPositions[i * 3 + 1] = y;
          sparkPositions[i * 3 + 2] = z;

          sparkData[i].vx = (Math.random() - 0.5) * 0.006;
          sparkData[i].vy = (Math.random() - 0.2) * 0.006;
          sparkData[i].vz = Math.random() * 0.005 + 0.002;
          sparkData[i].life = 1.0;
          sparkData[i].maxLife = 0.25 + Math.random() * 0.3;
          break;
        }
      }
    }

    function updateSparks(delta) {
      const pos = sparkGeo.attributes.position.array;
      for (let i = 0; i < MAX_SPARKS; i++) {
        if (sparkData[i].life > 0) {
          sparkData[i].life -= delta / sparkData[i].maxLife;
          
          pos[i * 3] += sparkData[i].vx;
          pos[i * 3 + 1] += sparkData[i].vy;
          pos[i * 3 + 2] += sparkData[i].vz;
          sparkData[i].vy -= 0.0001;

          if (sparkData[i].life <= 0) {
            pos[i * 3 + 2] = -999;
          }
        }
      }
      sparkGeo.attributes.position.needsUpdate = true;
    }

    // 5. RENDU CALLIGRAPHIQUE FLUIDE & MOUVEMENT MANUSCRIT
    let currentLineIndex = 0;
    let targetProgress = 0;
    let currentProgress = 0;
    let isWritingActive = false;

    function renderCanvasCalligraphy(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '46px "Great Vibes", cursive, serif';

      const startY = 90;
      const lineHeight = 65;

      // Lignes complétées
      for (let i = 0; i < currentLineIndex; i++) {
        const lineText = TEXT_TO_WRITE[i];
        if (!lineText) continue;
        
        ctx.fillStyle = '#f1f5f9';
        ctx.shadowColor = '#cbd5e1';
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.fillText(lineText, canvas.width / 2, startY + (i * lineHeight));
      }

      // Ligne en cours avec écriture fluide
      if (currentLineIndex < TEXT_TO_WRITE.length) {
        const lineText = TEXT_TO_WRITE[currentLineIndex];
        const yPos = startY + (currentLineIndex * lineHeight);

        if (lineText && lineText.length > 0) {
          const fullWidth = ctx.measureText(lineText).width;
          const startX = (canvas.width - fullWidth) / 2;

          ctx.save();
          // Masque d'apparition avec bordure adoucie
          ctx.beginPath();
          ctx.rect(startX - 10, yPos - 50, fullWidth * currentProgress + 10, 70);
          ctx.clip();

          ctx.fillStyle = '#f1f5f9';
          ctx.shadowColor = '#cbd5e1';
          ctx.shadowBlur = 12;
          ctx.textAlign = 'left';
          ctx.fillText(lineText, startX, yPos);
          ctx.restore();

          // Calcul des positions 3D et du mouvement manuscrit de la plume
          if (isWritingActive && currentProgress > 0.01 && currentProgress < 0.99) {
            const currentX2D = startX + (fullWidth * currentProgress);
            
            // Micro-oscillations verticales imitent les déliés/pleins de la main
            const writingOscillation = Math.sin(currentProgress * Math.PI * 28) * 4;
            const currentY2D = yPos - 8 + writingOscillation;

            const targetX3D = (currentX2D / 1024 - 0.5) * PLANE_WIDTH;
            const targetY3D = (0.5 - currentY2D / 512) * PLANE_HEIGHT;
            const targetZ3D = 0.03;

            // Placement de la plume
            quill3D.position.set(targetX3D, targetY3D, targetZ3D);

            // Légère inclinaison réactive
            quill3D.rotation.z = -Math.PI / 4.2 + (writingOscillation * 0.01);

            // Émission d'étincelles & audio
            emitSpark(targetX3D, targetY3D, targetZ3D);
            if (Math.random() < 0.35) playScratchSound();
          }
        }
      }

      textTexture.needsUpdate = true;
    }

    let lastTime = performance.now();

    function updateWritingAnimation() {
      if (!isWritingActive) return;

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (currentLineIndex < TEXT_TO_WRITE.length) {
        const currentText = TEXT_TO_WRITE[currentLineIndex];

        if (!currentText || currentText.length === 0) {
          currentLineIndex++;
          targetProgress = 0;
          currentProgress = 0;
        } else {
          // Progression de la cible
          const speed = 1.0 / (currentText.length * 0.09); // Vitesse adaptée à la longueur
          targetProgress += delta * speed;

          // Lissage d'inertie (Lerp) pour une fluidité parfaite
          currentProgress += (targetProgress - currentProgress) * 0.15;

          if (currentProgress >= 0.98 && targetProgress >= 1.0) {
            targetProgress = 0;
            currentProgress = 0;
            currentLineIndex++;
          }
        }
        renderCanvasCalligraphy(now);
      } else {
        isWritingActive = false;
        quill3D.visible = false;
        renderCanvasCalligraphy(now);
        playGongSound();
      }
    }

    function startWritingAnimation() {
      currentLineIndex = 0;
      targetProgress = 0;
      currentProgress = 0;
      isWritingActive = true;
      quill3D.visible = true;
      lastTime = performance.now();
    }

    // 6. DÉMARRAGE AR
    async function startAR() {
      initAudio();

      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';
      startBtn.textContent = 'CHARGEMENT...';

      statusTitle.textContent = "ACTIVATION";
      statusDesc.textContent = "Demande d'accès à la caméra...";

      try {
        const mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "./targets.mind"
        });

        const { renderer, scene, camera } = mindarThree;

        // Ajout de l'éclairage dans la scène
        scene.add(ambLight);
        scene.add(dirLight);

        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(textMesh);
        anchor.group.add(quill3D);
        anchor.group.add(sparkParticles);

        anchor.onTargetFound = () => {
          statusTitle.textContent = "RÉVÉLATION EN COURS";
          statusTitle.style.color = "#e2e8f0";
          statusDesc.textContent = "La plume de nacre trace le message...";
          startWritingAnimation();
        };

        anchor.onTargetLost = () => {
          statusTitle.textContent = "RECHERCHE DU SCEAU";
          statusTitle.style.color = "#ffaa00";
          statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";
          isWritingActive = false;
          quill3D.visible = false;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          textTexture.needsUpdate = true;
        };

        await mindarThree.start();

        startBtn.style.display = 'none';
        statusTitle.textContent = "RECHERCHE DU SCEAU";
        statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";

        let clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
          const delta = clock.getDelta();

          updateWritingAnimation();
          updateSparks(delta);

          renderer.render(scene, camera);
        });
      } catch (err) {
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        startBtn.textContent = 'INSPECTER LE MUR';
        displayGlobalError(err.message || err);
      }
    }

    startBtn.addEventListener('click', startAR);
  </script>
</body>
</html>
