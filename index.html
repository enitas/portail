<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Épreuve des Archontes - La Plume Céleste</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 14, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      color: #e2d1c3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 200;
      touch-action: manipulation;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }

    #error-console {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(180, 20, 20, 0.92);
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      border-radius: 8px;
      z-index: 300;
      word-break: break-all;
    }
  </style>

  <script>
    function displayGlobalError(msg) {
      var errBox = document.getElementById('error-console');
      var statusTitle = document.getElementById('status-title');
      var statusDesc = document.getElementById('status-desc');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = '❌ Erreur : ' + msg;
      }
      if (statusTitle) {
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
      }
      if (statusDesc) {
        statusDesc.textContent = "Consultez le message rouge ci-dessous.";
      }
    }

    window.onerror = function(message, source, lineno, colno, error) {
      displayGlobalError(message + ' (' + source + ':' + lineno + ')');
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      displayGlobalError(event.reason ? (event.reason.message || event.reason) : 'Erreur réseau/module');
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE DU SCEAU</div>
    <div id="status-desc">Appuyez sur le bouton pour démarrer.</div>
  </div>

  <button id="start-btn">INSPECTER LE MUR</button>
  <div id="error-console"></div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. AUDIO MINÉRAL & GONG
    let audioCtx = null;
    let isAudioActive = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isAudioActive = true;
    }

    function playScratchSound() {
      if (!isAudioActive || !audioCtx) return;
      try {
        const duration = 0.05;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1);
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 500 + Math.random() * 300;

        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.012, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + duration);
      } catch(e) {}
    }

    function playGongSound() {
      if (!isAudioActive || !audioCtx) return;
      try {
        const harmonics = [110, 220, 276.5, 440, 554.37, 659.25];
        const now = audioCtx.currentTime;

        harmonics.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          const vol = 0.12 / (i + 1);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 3.8);
        });
      } catch(e) {}
    }

    // 2. TEXTE ET PLAN DE RECONSTITUTION
    const TEXT_TO_WRITE = [
      "Nul ne franchira ces portes",
      "sans la lumiere de l'obsidienne.",
      "",
      "Regardez l'Orbe sous la lumiere noire :",
      "le passage s'ouvrira avec le code sacre."
    ];

    const PLANE_WIDTH = 1.2;
    const PLANE_HEIGHT = 0.6;

    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const textTexture = new THREE.CanvasTexture(canvas);
    
    const planeGeo = new THREE.PlaneGeometry(PLANE_WIDTH, PLANE_HEIGHT);
    const planeMat = new THREE.MeshBasicMaterial({ 
      map: textTexture, 
      transparent: true, 
      opacity: 0.98,
      side: THREE.DoubleSide
    });
    const textMesh = new THREE.Mesh(planeGeo, planeMat);
    textMesh.position.z = 0.02;

    // 3. PLUME 3D STYLISÉE (GÉOMÉTRIE TIGE + LAME DE PLUME D'OR)
    function create3DQuillModel() {
      const group = new THREE.Group();

      // Tige (Calamus)
      const shaftGeo = new THREE.CylinderGeometry(0.003, 0.001, 0.22, 16);
      const shaftMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
      const shaft = new THREE.Mesh(shaftGeo, shaftMat);
      shaft.position.y = 0.11;
      group.add(shaft);

      // Barbes de la plume (Feuille d'or 3D)
      const featherShape = new THREE.Shape();
      featherShape.moveTo(0, 0);
      featherShape.quadraticCurveTo(0.04, 0.08, 0.02, 0.18);
      featherShape.quadraticCurveTo(0, 0.22, 0, 0.24);
      featherShape.quadraticCurveTo(-0.02, 0.18, -0.04, 0.08);
      featherShape.quadraticCurveTo(0, 0, 0, 0);

      const extrudeSettings = { depth: 0.001, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.001, bevelThickness: 0.001 };
      const featherGeo = new THREE.ExtrudeGeometry(featherShape, extrudeSettings);
      const featherMat = new THREE.MeshBasicMaterial({ color: 0xd4af37, side: THREE.DoubleSide });
      const feather = new THREE.Mesh(featherGeo, featherMat);
      feather.position.y = 0.05;
      group.add(feather);

      // Pointe incandescente
      const tipGeo = new THREE.SphereGeometry(0.006, 16, 16);
      const tipMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const tip = new THREE.Mesh(tipGeo, tipMat);
      tip.position.y = 0;
      group.add(tip);

      // Orientation de la plume dans l'espace
      group.rotation.z = -Math.PI / 4;
      group.rotation.x = Math.PI / 6;

      return group;
    }

    const quill3D = create3DQuillModel();
    quill3D.visible = false;

    // 4. SYSTÈME DE PARTICULES 3D (ÉTINGELLES DE PLUME)
    const MAX_SPARKS = 150;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(MAX_SPARKS * 3);
    const sparkOpacities = new Float32Array(MAX_SPARKS);
    const sparkData = [];

    for (let i = 0; i < MAX_SPARKS; i++) {
      sparkPositions[i * 3] = 0;
      sparkPositions[i * 3 + 1] = 0;
      sparkPositions[i * 3 + 2] = 0;
      sparkOpacities[i] = 0;
      sparkData.push({ vx: 0, vy: 0, vz: 0, life: 0, maxLife: 1 });
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));

    // Texture d'étincelle
    const sparkCanvas = document.createElement('canvas');
    sparkCanvas.width = 16; sparkCanvas.height = 16;
    const sCtx = sparkCanvas.getContext('2d');
    const grad = sCtx.createRadialGradient(8,8,0, 8,8,8);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ffd700');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    sCtx.fillStyle = grad;
    sCtx.fillRect(0,0,16,16);
    const sparkTexture = new THREE.CanvasTexture(sparkCanvas);

    const sparkMat = new THREE.PointsMaterial({
      size: 0.025,
      map: sparkTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const sparkParticles = new THREE.Points(sparkGeo, sparkMat);

    function emitSpark(x, y, z) {
      for (let i = 0; i < MAX_SPARKS; i++) {
        if (sparkData[i].life <= 0) {
          sparkPositions[i * 3] = x;
          sparkPositions[i * 3 + 1] = y;
          sparkPositions[i * 3 + 2] = z;

          sparkData[i].vx = (Math.random() - 0.5) * 0.008;
          sparkData[i].vy = (Math.random() - 0.2) * 0.008;
          sparkData[i].vz = Math.random() * 0.006 + 0.002;
          sparkData[i].life = 1.0;
          sparkData[i].maxLife = 0.3 + Math.random() * 0.4; // Durée de vie en secondes
          break;
        }
      }
    }

    function updateSparks(delta) {
      const pos = sparkGeo.attributes.position.array;
      for (let i = 0; i < MAX_SPARKS; i++) {
        if (sparkData[i].life > 0) {
          sparkData[i].life -= delta / sparkData[i].maxLife;
          
          pos[i * 3] += sparkData[i].vx;
          pos[i * 3 + 1] += sparkData[i].vy;
          pos[i * 3 + 2] += sparkData[i].vz;

          // Légère gravité
          sparkData[i].vy -= 0.00015;

          if (sparkData[i].life <= 0) {
            pos[i * 3 + 2] = -999; // Cacher la particule
          }
        }
      }
      sparkGeo.attributes.position.needsUpdate = true;
    }

    // 5. ANIMATION DE CALLIGRAPHIE FLUIDE (CONTINUE)
    let currentLineIndex = 0;
    let lineProgress = 0; // De 0.0 à 1.0
    let isWritingActive = false;

    function renderCanvasCalligraphy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '46px "Great Vibes", cursive, serif';

      const startY = 90;
      const lineHeight = 65;

      // Lignes précédentes déjà écrites
      for (let i = 0; i < currentLineIndex; i++) {
        const lineText = TEXT_TO_WRITE[i];
        if (!lineText) continue;
        
        ctx.fillStyle = '#f5e6b3';
        ctx.shadowColor = '#d4af37';
        ctx.shadowBlur = 14;
        ctx.textAlign = 'center';
        ctx.fillText(lineText, canvas.width / 2, startY + (i * lineHeight));
      }

      // Ligne active en cours de tracé fluide (Masque continu)
      if (currentLineIndex < TEXT_TO_WRITE.length) {
        const lineText = TEXT_TO_WRITE[currentLineIndex];
        const yPos = startY + (currentLineIndex * lineHeight);

        if (lineText && lineText.length > 0) {
          const fullWidth = ctx.measureText(lineText).width;
          const startX = (canvas.width - fullWidth) / 2;

          ctx.save();
          // Masque de découpe dynamique au pixel près
          ctx.beginPath();
          ctx.rect(startX - 10, yPos - 50, fullWidth * lineProgress + 10, 70);
          ctx.clip();

          ctx.fillStyle = '#f5e6b3';
          ctx.shadowColor = '#d4af37';
          ctx.shadowBlur = 14;
          ctx.textAlign = 'left';
          ctx.fillText(lineText, startX, yPos);
          ctx.restore();

          // Calcul des coordonnées 2D puis conversion 3D pour la plume & étincelles
          if (isWritingActive && lineProgress > 0 && lineProgress < 1) {
            const currentX2D = startX + (fullWidth * lineProgress);
            const currentY2D = yPos - 8;

            // Conversion coordonnées Canvas (1024x512) -> Scène 3D (1.2x0.6)
            const targetX3D = (currentX2D / 1024 - 0.5) * PLANE_WIDTH;
            const targetY3D = (0.5 - currentY2D / 512) * PLANE_HEIGHT;
            const targetZ3D = 0.03;

            quill3D.position.set(targetX3D, targetY3D, targetZ3D);

            // Émettre des étincelles 3D à la pointe
            emitSpark(targetX3D, targetY3D, targetZ3D);

            // Jouer le son de frottement de manière fluide
            if (Math.random() < 0.4) playScratchSound();
          }
        }
      }

      textTexture.needsUpdate = true;
    }

    let lastTime = performance.now();

    function updateWritingAnimation() {
      if (!isWritingActive) return;

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (currentLineIndex < TEXT_TO_WRITE.length) {
        const currentText = TEXT_TO_WRITE[currentLineIndex];

        if (!currentText || currentText.length === 0) {
          // Sauter les lignes vides instantanément
          currentLineIndex++;
          lineProgress = 0;
        } else {
          // Vitesse fluide proportionnelle à la longueur de la phrase
          const durationPerLine = currentText.length * 0.085; // ~85ms par caractère
          lineProgress += delta / durationPerLine;

          if (lineProgress >= 1.0) {
            lineProgress = 0;
            currentLineIndex++;
          }
        }
        renderCanvasCalligraphy();
      } else {
        // Fin du tracé
        isWritingActive = false;
        quill3D.visible = false;
        renderCanvasCalligraphy();
        playGongSound();
      }
    }

    function startWritingAnimation() {
      currentLineIndex = 0;
      lineProgress = 0;
      isWritingActive = true;
      quill3D.visible = true;
      lastTime = performance.now();
    }

    // 6. INITIALISATION AR ET BOUCLE DE RENDU 3D
    async function startAR() {
      initAudio();

      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';
      startBtn.textContent = 'CHARGEMENT...';

      statusTitle.textContent = "ACTIVATION";
      statusDesc.textContent = "Demande d'accès à la caméra...";

      try {
        const mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "./targets.mind"
        });

        const { renderer, scene, camera } = mindarThree;

        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(textMesh);
        anchor.group.add(quill3D);
        anchor.group.add(sparkParticles);

        anchor.onTargetFound = () => {
          statusTitle.textContent = "RÉVÉLATION EN COURS";
          statusTitle.style.color = "#d4af37";
          statusDesc.textContent = "Une plume invisible trace un message...";
          startWritingAnimation();
        };

        anchor.onTargetLost = () => {
          statusTitle.textContent = "RECHERCHE DU SCEAU";
          statusTitle.style.color = "#ffaa00";
          statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";
          isWritingActive = false;
          quill3D.visible = false;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          textTexture.needsUpdate = true;
        };

        await mindarThree.start();

        startBtn.style.display = 'none';
        statusTitle.textContent = "RECHERCHE DU SCEAU";
        statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";

        let clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
          const delta = clock.getDelta();

          updateWritingAnimation();
          updateSparks(delta);

          renderer.render(scene, camera);
        });
      } catch (err) {
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        startBtn.textContent = 'INSPECTER LE MUR';
        displayGlobalError(err.message || err);
      }
    }

    startBtn.addEventListener('click', startAR);
  </script>
</body>
</html>
