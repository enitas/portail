<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Épreuve des Archontes - La Plume Céleste</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 14, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      color: #e2d1c3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 200;
      touch-action: manipulation;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }

    #error-console {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(180, 20, 20, 0.92);
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      border-radius: 8px;
      z-index: 300;
      word-break: break-all;
    }
  </style>

  <script>
    function displayGlobalError(msg) {
      var errBox = document.getElementById('error-console');
      var statusTitle = document.getElementById('status-title');
      var statusDesc = document.getElementById('status-desc');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = '❌ Erreur : ' + msg;
      }
      if (statusTitle) {
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
      }
      if (statusDesc) {
        statusDesc.textContent = "Consultez le message rouge ci-dessous.";
      }
    }

    window.onerror = function(message, source, lineno, colno, error) {
      displayGlobalError(message + ' (' + source + ':' + lineno + ')');
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      displayGlobalError(event.reason ? (event.reason.message || event.reason) : 'Erreur réseau/module');
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE DU SCEAU</div>
    <div id="status-desc">Appuyez sur le bouton pour démarrer.</div>
  </div>

  <button id="start-btn">INSPECTER LE MUR</button>
  <div id="error-console"></div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. MOTEUR SONORE PROCÉDURAL (SANS FICHIER EXTERNE)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Bruit léger de frottement/gravure de la pierre
    function playScratchSound() {
      if (!audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 0.03; // 30ms
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.5;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1600 + Math.random() * 800;
        filter.Q.value = 4;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch(e) {}
    }

    // Gong Céleste à la fin de la révélation
    function playGongSound() {
      if (!audioCtx) return;
      try {
        const harmonics = [110, 220, 276.5, 440, 554.37, 659.25];
        const now = audioCtx.currentTime;

        harmonics.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          const vol = 0.12 / (i + 1);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 3.8);
        });
      } catch(e) {}
    }

    // 2. TEXTE & CANVAS
    const TEXT_TO_WRITE = [
      "Nul ne franchira ces portes",
      "sans la lumiere de l'obsidienne.",
      "",
      "Regardez l'Orbe sous la lumiere noire :",
      "le passage s'ouvrira avec le code sacre."
    ];

    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const textTexture = new THREE.CanvasTexture(canvas);
    
    const planeGeo = new THREE.PlaneGeometry(1.2, 0.6);
    const planeMat = new THREE.MeshBasicMaterial({ 
      map: textTexture, 
      transparent: true, 
      opacity: 0.98,
      side: THREE.DoubleSide
    });
    const textMesh = new THREE.Mesh(planeGeo, planeMat);
    textMesh.position.z = 0.02;

    let currentLineIndex = 0;
    let currentCharIndex = 0;
    let animationTimer = null;
    let isWritingActive = false;

    // Dessin de la Plume Calligraphique Dorée
    function drawQuillFeather(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 3.8); // Inclinaison naturelle de l'écriture

      // 1. Lueur d'énergie à la pointe
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 18;
      ctx.fill();

      // 2. Tige de la plume (Calamus)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -85);
      ctx.strokeStyle = '#f5e6b3';
      ctx.lineWidth = 2.2;
      ctx.shadowColor = '#d4af37';
      ctx.shadowBlur = 8;
      ctx.stroke();

      // 3. Corps de la plume (Barbes)
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.quadraticCurveTo(-22, -45, -16, -75);
      ctx.quadraticCurveTo(-6, -92, 0, -96);
      ctx.quadraticCurveTo(6, -92, 16, -75);
      ctx.quadraticCurveTo(22, -45, 0, -20);

      const grad = ctx.createLinearGradient(0, -96, 0, -20);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, '#ffd700');
      grad.addColorStop(0.8, '#b38711');
      grad.addColorStop(1, 'rgba(80, 50, 10, 0.2)');

      ctx.fillStyle = grad;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 12;
      ctx.fill();

      // 4. Stries de détails sur les barbes de la plume
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 0.8;
      for (let i = -30; i >= -80; i -= 9) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(-12, i - 6);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(12, i - 6);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderCanvasCalligraphy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '46px "Great Vibes", cursive, serif';

      let startY = 90;
      const lineHeight = 65;

      // Lignes déjà complétées
      for (let i = 0; i < currentLineIndex; i++) {
        const lineText = TEXT_TO_WRITE[i];
        if (!lineText) continue;
        
        ctx.fillStyle = '#f5e6b3';
        ctx.shadowColor = '#d4af37';
        ctx.shadowBlur = 14;
        ctx.textAlign = 'center';
        ctx.fillText(lineText, canvas.width / 2, startY + (i * lineHeight));
      }

      // Ligne en cours de tracé
      if (currentLineIndex < TEXT_TO_WRITE.length) {
        const lineText = TEXT_TO_WRITE[currentLineIndex];
        const yPos = startY + (currentLineIndex * lineHeight);

        if (lineText && lineText.length > 0) {
          const fullWidth = ctx.measureText(lineText).width;
          const startX = (canvas.width - fullWidth) / 2;
          const partialText = lineText.substring(0, currentCharIndex);
          const partialWidth = ctx.measureText(partialText).width;

          ctx.fillStyle = '#f5e6b3';
          ctx.shadowColor = '#d4af37';
          ctx.shadowBlur = 14;
          ctx.textAlign = 'left';
          ctx.fillText(partialText, startX, yPos);

          // Afficher la plume sur la pointe active
          if (isWritingActive && currentCharIndex > 0 && currentCharIndex <= lineText.length) {
            const tipX = startX + partialWidth;
            drawQuillFeather(ctx, tipX, yPos - 8);
          }
        }
      }

      textTexture.needsUpdate = true;
    }

    function startWritingAnimation() {
      currentLineIndex = 0;
      currentCharIndex = 0;
      isWritingActive = true;
      clearInterval(animationTimer);

      animationTimer = setInterval(() => {
        if (currentLineIndex < TEXT_TO_WRITE.length) {
          if (currentCharIndex < TEXT_TO_WRITE[currentLineIndex].length) {
            currentCharIndex++;
            playScratchSound(); // Son de gravure à chaque lettre
          } else {
            currentLineIndex++;
            currentCharIndex = 0;
          }
          renderCanvasCalligraphy();
        } else {
          isWritingActive = false;
          clearInterval(animationTimer);
          renderCanvasCalligraphy(); // Retirer la plume
          playGongSound(); // Gong final !
        }
      }, 90);
    }

    // 3. DÉMARRAGE AR
    async function startAR() {
      initAudio(); // Activer l'audio sur le clic utilisateur

      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';
      startBtn.textContent = 'CHARGEMENT...';

      statusTitle.textContent = "ACTIVATION";
      statusDesc.textContent = "Demande d'accès à la caméra...";

      try {
        const mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "./targets.mind"
        });

        const { renderer, scene, camera } = mindarThree;

        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(textMesh);

        anchor.onTargetFound = () => {
          statusTitle.textContent = "RÉVÉLATION EN COURS";
          statusTitle.style.color = "#d4af37";
          statusDesc.textContent = "Une plume invisible trace un message...";
          startWritingAnimation();
        };

        anchor.onTargetLost = () => {
          statusTitle.textContent = "RECHERCHE DU SCEAU";
          statusTitle.style.color = "#ffaa00";
          statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";
          isWritingActive = false;
          clearInterval(animationTimer);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          textTexture.needsUpdate = true;
        };

        await mindarThree.start();

        startBtn.style.display = 'none';
        statusTitle.textContent = "RECHERCHE DU SCEAU";
        statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      } catch (err) {
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        startBtn.textContent = 'INSPECTER LE MUR';
        displayGlobalError(err.message || err);
      }
    }

    startBtn.addEventListener('click', startAR);
  </script>
</body>
</html>
