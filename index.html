<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Épreuve des Archontes - La Plume Céleste</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 14, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      color: #e2d1c3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 200;
      touch-action: manipulation;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }

    #error-console {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(180, 20, 20, 0.92);
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      border-radius: 8px;
      z-index: 300;
      word-break: break-all;
    }
  </style>

  <script>
    function displayGlobalError(msg) {
      var errBox = document.getElementById('error-console');
      var statusTitle = document.getElementById('status-title');
      var statusDesc = document.getElementById('status-desc');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = '❌ Erreur : ' + msg;
      }
      if (statusTitle) {
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
      }
      if (statusDesc) {
        statusDesc.textContent = "Consultez le message rouge ci-dessous.";
      }
    }

    window.onerror = function(message, source, lineno, colno, error) {
      displayGlobalError(message + ' (' + source + ':' + lineno + ')');
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      displayGlobalError(event.reason ? (event.reason.message || event.reason) : 'Erreur réseau/module');
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE DU SCEAU</div>
    <div id="status-desc">Appuyez sur le bouton pour démarrer.</div>
  </div>

  <button id="start-btn">INSPECTER LE MUR</button>
  <div id="error-console"></div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    const TEXT_TO_WRITE = [
      "Nul ne franchira ce portail",
      "Celui qui cherche la lumière doit observer ce qui est caché à l'œil nu...",
      "",
      "Regardez l'Orbe sous la lumiere bleu :",
      "le passage s'ouvrira avec le code sacre."
    ];

    // 1. CANVAS ET CALLIGRAPHIE
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const textTexture = new THREE.CanvasTexture(canvas);
    
    const planeGeo = new THREE.PlaneGeometry(1.2, 0.6);
    const planeMat = new THREE.MeshBasicMaterial({ 
      map: textTexture, 
      transparent: true, 
      opacity: 0.98,
      side: THREE.DoubleSide
    });
    const textMesh = new THREE.Mesh(planeGeo, planeMat);
    textMesh.position.z = 0.02;

    let currentLineIndex = 0;
    let currentCharIndex = 0;
    let animationTimer = null;
    let isWritingActive = false;

    function renderCanvasCalligraphy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '46px "Great Vibes", cursive, serif';

      let startY = 90;
      const lineHeight = 65;

      // Dessiner les lignes terminées (centrées)
      for (let i = 0; i < currentLineIndex; i++) {
        const lineText = TEXT_TO_WRITE[i];
        if (!lineText) continue;
        
        ctx.fillStyle = '#f5e6b3';
        ctx.shadowColor = '#d4af37';
        ctx.shadowBlur = 14;
        ctx.textAlign = 'center';
        ctx.fillText(lineText, canvas.width / 2, startY + (i * lineHeight));
      }

      // Dessiner la ligne en cours d'écriture (synchro parfaite)
      if (currentLineIndex < TEXT_TO_WRITE.length) {
        const lineText = TEXT_TO_WRITE[currentLineIndex];
        const yPos = startY + (currentLineIndex * lineHeight);

        if (lineText && lineText.length > 0) {
          const fullWidth = ctx.measureText(lineText).width;
          const startX = (canvas.width - fullWidth) / 2;
          const partialText = lineText.substring(0, currentCharIndex);
          const partialWidth = ctx.measureText(partialText).width;

          // Alignement à gauche depuis le point de départ centré
          ctx.fillStyle = '#f5e6b3';
          ctx.shadowColor = '#d4af37';
          ctx.shadowBlur = 14;
          ctx.textAlign = 'left';
          ctx.fillText(partialText, startX, yPos);

          // Synchronisation de la pointe lumineuse
          if (isWritingActive && currentCharIndex > 0 && currentCharIndex <= lineText.length) {
            const tipX = startX + partialWidth;

            ctx.save();
            // Point central hyper brillant
            ctx.beginPath();
            ctx.arc(tipX, yPos - 10, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffe066';
            ctx.shadowBlur = 25;
            ctx.fill();

            // Halo étincelant autour de la pointe
            ctx.beginPath();
            ctx.arc(tipX, yPos - 10, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(212, 175, 55, 0.25)';
            ctx.fill();
            ctx.restore();
          }
        }
      }

      textTexture.needsUpdate = true;
    }

    function startWritingAnimation() {
      currentLineIndex = 0;
      currentCharIndex = 0;
      isWritingActive = true;
      clearInterval(animationTimer);

      // Vitesse ralentie à 85ms par caractère
      animationTimer = setInterval(() => {
        if (currentLineIndex < TEXT_TO_WRITE.length) {
          if (currentCharIndex < TEXT_TO_WRITE[currentLineIndex].length) {
            currentCharIndex++;
          } else {
            currentLineIndex++;
            currentCharIndex = 0;
          }
          renderCanvasCalligraphy();
        } else {
          isWritingActive = false;
          clearInterval(animationTimer);
          renderCanvasCalligraphy(); // Retirer la pointe lumineuse à la fin
        }
      }, 85);
    }

    // 2. POUSSIÈRE D'OR 3D SEULEMENT
    function createGoldDustEffect() {
      const group = new THREE.Group();

      // Texture de particule d'or luminescente
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 32; pCanvas.height = 32;
      const pCtx = pCanvas.getContext('2d');
      const grad = pCtx.createRadialGradient(16,16,0, 16,16,16);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, '#ffd700');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      pCtx.fillStyle = grad;
      pCtx.fillRect(0,0,32,32);
      const pTexture = new THREE.CanvasTexture(pCanvas);

      // Poussière d'or flottante dans la pièce (120 particules)
      const particleCount = 120;
      const particleGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];

      for(let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 1.4;
        positions[i*3 + 1] = (Math.random() - 0.5) * 0.8;
        positions[i*3 + 2] = Math.random() * 0.4;
        
        velocities.push({
          x: (Math.random() - 0.5) * 0.001,
          y: Math.random() * 0.0015 + 0.0005,
          z: Math.random() * 0.001 + 0.0005
        });
      }

      particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 0.035,
        map: pTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.85
      });

      const particles = new THREE.Points(particleGeo, particleMat);
      group.add(particles);

      return { group, particles, particleCount, velocities };
    }

    // 3. DÉMARRAGE AR
    async function startAR() {
      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';
      startBtn.textContent = 'CHARGEMENT...';

      statusTitle.textContent = "ACTIVATION";
      statusDesc.textContent = "Demande d'accès à la caméra...";

      try {
        const mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "./targets.mind"
        });

        const { renderer, scene, camera } = mindarThree;

        const anchor = mindarThree.addAnchor(0);
        
        // Ajouter le texte et l'effet de poussière d'or 3D
        anchor.group.add(textMesh);
        const fx = createGoldDustEffect();
        anchor.group.add(fx.group);

        anchor.onTargetFound = () => {
          statusTitle.textContent = "RÉVÉLATION EN COURS";
          statusTitle.style.color = "#d4af37";
          statusDesc.textContent = "Une plume invisible trace un message...";
          startWritingAnimation();
        };

        anchor.onTargetLost = () => {
          statusTitle.textContent = "RECHERCHE DU SCEAU";
          statusTitle.style.color = "#ffaa00";
          statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";
          isWritingActive = false;
          clearInterval(animationTimer);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          textTexture.needsUpdate = true;
        };

        await mindarThree.start();

        startBtn.style.display = 'none';
        statusTitle.textContent = "RECHERCHE DU SCEAU";
        statusDesc.textContent = "Pointez la caméra vers le symbole sacré.";

        // Animation en boucle : Mouvement des Poussières d'or uniquement
        renderer.setAnimationLoop(() => {
          const pos = fx.particles.geometry.attributes.position.array;
          for(let i = 0; i < fx.particleCount; i++) {
            pos[i*3 + 1] += fx.velocities[i].y;
            pos[i*3 + 2] += fx.velocities[i].z;

            if (pos[i*3 + 1] > 0.5) pos[i*3 + 1] = -0.5;
            if (pos[i*3 + 2] > 0.5) pos[i*3 + 2] = 0;
          }
          fx.particles.geometry.attributes.position.needsUpdate = true;

          renderer.render(scene, camera);
        });
      } catch (err) {
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        startBtn.textContent = 'INSPECTER LE MUR';
        displayGlobalError(err.message || err);
      }
    }

    startBtn.addEventListener('click', startAR);
  </script>
</body>
</html>
